<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11131a"><title>Tooplay 리모컨</title><link rel="stylesheet" href="/remote.css"></head>
<body><main><header><span class="logo">▶</span><div><strong>TOOPLAY</strong><p>컴퓨터 리모컨</p></div><span id="connection">연결 전</span></header>
<section id="pair"><h1>큰 화면을<br>손안에서.</h1><p>컴퓨터 Tooplay의 ‘휴대폰 연결’에 표시된<br>6자리 코드를 입력하세요.</p><form id="pairForm"><label for="code">연결 코드</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><button id="pairButton" type="submit">컴퓨터에 연결</button></form></section>
<section id="player" hidden><div class="now"><span id="target">컴퓨터에서 재생</span><h1 id="title">영상을 열어 주세요</h1><p id="status"></p></div>
<label for="seek">재생 위치</label><input id="seek" type="range" min="0" max="1" step="1" value="0"><div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
<div class="transport"><button id="back" aria-label="10초 뒤로">−10초</button><button id="play" class="primary">재생</button><button id="forward" aria-label="10초 앞으로">+10초</button></div>
<div class="card"><label for="volume">볼륨</label><input id="volume" type="range" min="0" max="1" step="0.05" value="1"><label for="subtitle">자막</label><select id="subtitle"><option value="">자막 끄기</option></select></div>
<div class="card"><label for="devices">TV 전송</label><select id="devices"><option value="">기기를 찾는 중…</option></select><button id="cast">선택한 TV로 전송</button><button id="castStop" class="secondary" hidden>TV 전송 중지</button></div>
<button id="disconnect" class="secondary">이 휴대폰 연결 해제</button></section>
<p id="message" role="status" aria-live="polite"></p><footer>같은 Wi-Fi · 컴퓨터에서 연 영상을 조작합니다.</footer></main><script src="/remote.js"></script></body></html>
